name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release
        env:
          # 仅校验静态构建；测试不会使用此占位公钥访问 Metered。
          VITE_METERED_PUBLISHABLE_KEY: pk_live_ci_build_only
